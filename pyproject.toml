[project]
name = "agent-usage-tracker"
dynamic = ["version"]
description = "Track coding-agent usage and outcomes from local logs, find recurring problems, and test proposed fixes before adopting them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tokens", "usage", "coding-agent", "claude-code", "codex", "cursor", "pi", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
# Base install has ZERO runtime dependencies: stdlib json / sqlite3 / urllib / tomllib / hashlib.
# The one exception is Windows only: it ships no time zone database, and zoneinfo needs one.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
# Only needed if you use the direct-Postgres fallback transport (transport.pg_dsn).
postgres = ["psycopg[binary]>=3.1"]
# `aut label`: a local model through mlx-lm, Apple silicon only (every test runs without it),
# and psycopg, since every label command reads the sink. Tested on mlx-lm 0.32 for Gemma and every
# Qwen3.5 decider; the deciders reach into its text model, so a new minor is a re-test.
label = [
    "psycopg[binary]>=3.1",
    # Floors proven by a real load and generate of a Gemma 4 build: mlx-lm 0.31.2 has the module
    # but cannot load the weights, 0.31.3 can. huggingface_hub 1.3 brings the `hf` command.
    "mlx-lm>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx>=0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=1.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Once, in its own environment: `python -m agent_usage_tracker.label.merge evalengine-4b`.
merge = ["torch>=2.14", "peft>=0.21", "transformers>=5.17", "huggingface_hub>=1.3"]

# The evidence CLI runs without the optional MCP server.
mcp = ["mcp>=1.30,<2"]
code = ["pydantic-monty>=1.6,<1.7"]

# Run the suite: pip install -e '.[test]' && pytest -q
test = ["pytest", "pytest-xdist==3.8.0"]

[project.urls]
Homepage = "https://github.com/rhnfzl/agent-usage-tracker"
Issues = "https://github.com/rhnfzl/agent-usage-tracker/issues"

[project.scripts]
aut = "agent_usage_tracker.cli:main"
# The package name too, so `uvx agent-usage-tracker` runs without --from.
agent-usage-tracker = "agent_usage_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# One version: the release workflow checks the tag against it.
[tool.hatch.version]
path = "src/agent_usage_tracker/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_usage_tracker"]

[tool.hatch.build.targets.wheel.force-include]
"packaging/launchd/dev.aut.scan.plist" = "agent_usage_tracker/setup_assets/dev.aut.scan.plist"
"packaging/systemd/agent-usage-tracker.service" = "agent_usage_tracker/setup_assets/agent-usage-tracker.service"
"packaging/systemd/agent-usage-tracker.timer" = "agent_usage_tracker/setup_assets/agent-usage-tracker.timer"
"packaging/windows/register-task.ps1" = "agent_usage_tracker/setup_assets/register-task.ps1"

# Listed, not "everything not gitignored": a local checkout holds .worktrees/, .runtime-releases/,
# old venvs and agent folders that must never reach an upload. Tests read packaging/ and docs/.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/packaging", "/README.md", "/LICENSE", "/CONTRACT.md",
           "/DEPLOY.md", "/config.example.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# the test folders import each other's fixtures by module name
pythonpath = ["src", "tests/collectors", "tests/label", "tests/outcomes", "tests/pipeline"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
disallow_any_generics = true

# Optional extras: the base install, and CI's lint job, have none of them.
[[tool.mypy.overrides]]
module = ["psycopg.*", "mlx.*", "mlx_lm.*", "huggingface_hub.*", "transformers.*", "torch.*", "peft.*",
          "mcp.*", "anyio.*", "uvicorn.*", "starlette.*", "pydantic_monty.*"]
ignore_missing_imports = true
