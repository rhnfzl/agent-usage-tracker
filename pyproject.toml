[project]
name = "agent-usage-tracker"
version = "0.1.0"
description = "Passive, subscription-safe tracker of coding-agent work (Claude Code, Codex, Cursor, Pi): usage, sessions, activity, active time, outcomes and local labels. Reads local logs, normalizes, pushes to a self-hosted sink."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tokens", "usage", "coding-agent", "claude-code", "codex", "cursor", "pi", "observability"]
# Base install has ZERO runtime dependencies: stdlib json / sqlite3 / urllib / tomllib / hashlib.
dependencies = []

[project.optional-dependencies]
# Only needed if you use the direct-Postgres fallback transport (transport.pg_dsn).
postgres = ["psycopg[binary]>=3.1"]
# `aut label`: a local model through mlx-lm, Apple silicon only (every test runs without it),
# and psycopg, since every label command reads the sink.
label = [
    "psycopg[binary]>=3.1",
    "mlx-lm>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "huggingface_hub>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Run the suite: pip install -e '.[test]' && pytest -q
test = ["pytest"]

[project.scripts]
aut = "agent_usage_tracker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_usage_tracker"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true

# Optional extras: the base install, and CI's lint job, have none of them.
[[tool.mypy.overrides]]
module = ["psycopg.*", "mlx.*", "mlx_lm.*", "huggingface_hub.*"]
ignore_missing_imports = true
