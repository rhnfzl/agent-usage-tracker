name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new PR run supersedes the previous one. Main pushes and manual reruns have separate groups.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.run_attempt == '1' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  # The OS matrix is not decoration: the README claims macOS/Linux/Windows and the
  # collectors resolve agent log paths per-OS, so all three get exercised.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Keep room for slow macOS runners.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # macOS runners queue for a long time; the oldest and newest Python there is enough,
        # Linux and Windows still run every version.
        exclude:
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.14" }
        # One job runs off UTC, so local-time code (`aut time add`, label days) is exercised.
        include:
          - { os: ubuntu-latest, python-version: "3.13", tz: America/Los_Angeles }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      # Use a fixed worker count to leave capacity for tests that launch child processes.
      - run: pytest -q -n 3 --dist worksteal --max-worker-restart=0 --durations=15
        env:
          TZ: ${{ matrix.tz }}

  # The sink layer's SQL against a real server, on the shipped schema (sink_stack/apply.sh, with
  # psql from the runner image); every other job skips these tests. Same image as compose.yaml.
  sink-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: timescale/timescaledb:2.32.1-pg17
        env:
          POSTGRES_PASSWORD: aut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUT_TEST_PG_DSN: postgresql://postgres:aut@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,postgres]"
      - run: pytest -q tests/pipeline/test_sink_sql.py
      - name: compose file is valid
        working-directory: src/agent_usage_tracker/sink_stack
        run: >-
          AUT_PG_ADMIN_PASSWORD=x AUT_WRITER_PASSWORD=x AUT_RO_PASSWORD=x
          AUT_GRAFANA_ADMIN_PASSWORD=x AUT_TZ=UTC docker compose config --quiet

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: an unpinned linter silently changes the repo's standard when a new
      # release adds rules, turning a green build red with no code change.
      - run: pip install ruff==0.15.11 mypy==2.4.1
      - run: ruff check .
      - run: mypy

  required:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test, sink-sql, lint]
    if: ${{ always() }}
    steps:
      - name: Require every validation job to pass
        env:
          TEST: ${{ needs.test.result }}
          SINK_SQL: ${{ needs.sink-sql.result }}
          LINT: ${{ needs.lint.result }}
        run: |
          printf 'test=%s\nsink-sql=%s\nlint=%s\n' "$TEST" "$SINK_SQL" "$LINT"
          test "$TEST" = success && test "$SINK_SQL" = success && test "$LINT" = success
