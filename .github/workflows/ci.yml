name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The OS matrix is not decoration: the README claims macOS/Linux/Windows and the
  # collectors resolve agent log paths per-OS, so all three get exercised.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: an unpinned linter silently changes the repo's standard when a new
      # release adds rules, turning a green build red with no code change.
      - run: pip install ruff==0.15.11
      - run: ruff check .
