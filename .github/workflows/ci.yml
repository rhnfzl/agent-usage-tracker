name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The OS matrix is not decoration: the README claims macOS/Linux/Windows and the
  # collectors resolve agent log paths per-OS, so all three get exercised.
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # macOS runners queue for a long time; the oldest and newest Python there is enough,
        # Linux and Windows still run every version.
        exclude:
          - { os: macos-latest, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.14" }
        # One job runs off UTC, so local-time code (`aut time add`, label days) is exercised.
        include:
          - { os: ubuntu-latest, python-version: "3.13", tz: America/Los_Angeles }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest -q
        env:
          TZ: ${{ matrix.tz }}

  # The sink layer's SQL against a real server; every other job skips these tests.
  sink-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: aut
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUT_TEST_PG_DSN: postgresql://postgres:aut@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[test,postgres]"
      - run: pytest -q tests/test_sink_sql.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: an unpinned linter silently changes the repo's standard when a new
      # release adds rules, turning a green build red with no code change.
      - run: pip install ruff==0.15.11 mypy==2.4.1
      - run: ruff check .
      - run: mypy
