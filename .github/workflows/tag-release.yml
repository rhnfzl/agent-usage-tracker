name: Tag release

on:
  push:
    branches: [main]
    paths: [src/agent_usage_tracker/__init__.py]

permissions:
  actions: write
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and start the release for a version change
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version_file=src/agent_usage_tracker/__init__.py
          version_pattern='s/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p'
          git show "$BEFORE:$version_file" > "$RUNNER_TEMP/previous-version.py"
          previous=$(sed -nE "$version_pattern" "$RUNNER_TEMP/previous-version.py")
          version=$(sed -nE "$version_pattern" "$version_file")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Set __version__ to a version in X.Y.Z format."
            exit 1
          }
          if [[ "$version" == "$previous" ]]; then
            echo "Version $version has not changed."
            exit 0
          fi

          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            [[ "$(git rev-parse "refs/tags/$tag^{commit}")" == "$GITHUB_SHA" ]] || {
              echo "Tag $tag already points to another commit. Use a new version."
              exit 1
            }
            echo "Tag $tag already points to this commit."
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$tag" "$GITHUB_SHA" -m "$tag"
            git push origin "refs/tags/$tag"
          fi

          # GITHUB_TOKEN tag pushes do not start workflows. Dispatch on the tag
          # so the publish job meets the PyPI environment's tag policy.
          gh workflow run release.yml --ref "$tag"
