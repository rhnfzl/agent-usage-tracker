# gitleaks config for agent-usage-tracker.
# This repo is private now and intended to open later, so the no-secrets rule is
# enforced from day one: run `gitleaks detect` before flipping it public.
title = "agent-usage-tracker"

[extend]
useDefault = true

[allowlist]
# Only narrowly-scoped placeholder patterns are allowed. NO whole-file path exclusions, so a
# real secret accidentally committed to a doc still trips the scan.
regexes = [
  '''env:[A-Z_]+''',                          # env-var indirections are references, not secrets
  '''https://n8n\.example[^\s'"]*''',         # placeholder webhook host in docs
  '''postgresql://agents_writer@db\.example[^\s'"]*''',  # placeholder DSN in docs (host pinned)
]
