# Copy to ~/.config/agent-usage-tracker/config.toml and edit.
# SECRETS NEVER LIVE IN THIS REPO. Put real values in the local config file or the
# environment; any "env:VAR" value is resolved at run time. That local file lives OUTSIDE
# the repo, so gitignore does not protect it - restrict it with filesystem permissions:
#   chmod 600 ~/.config/agent-usage-tracker/config.toml   (macOS / Linux)

# Role-based label for this machine (avoid personal names). e.g. laptop, buildbox, workstation.
machine = "laptop"

# Which agents to collect. Omit to collect every collector except the opt-in activitywatch.
# IMPORTANT: the three Cursor sources
# OVERLAP - enabling more than one double-counts the same Cursor usage under different event ids:
#   cursor      = local IDE state.vscdb (a lower bound; no CLI, no model/cache attribution)
#   cursor_sdk  = SDK-app run manifests  (needs cursor_sdk_manifests below)
#   cursor_api  = Cursor dashboard API   (accurate; CLI + IDE; needs cursor_api = true below)
# Pick ONE token source. The default below is cursor_api (the accurate source). If you instead
# want only SDK manifest capture, swap cursor_api -> cursor_sdk here; if you can't use the API,
# use `cursor`. If you omit `agents`, cursor, cursor_sdk and cursor_api are ALL on, so set
# `agents` yourself before cursor_api = true. NOTE on human turns: cursor_api / cursor_sdk have
# none. Cursor CLI human turns come from cursor_cli (in the list below). Cursor IDE human turns
# come only from the local `cursor` collector (at coarse conversation-level time). To add `cursor`
# alongside cursor_api JUST for IDE human turns, set cursor_human_only = true below - without it
# their token counts double up.
# cursor_cli is NOT a token source and overlaps none of them: it reads the cursor-agent CLI chat
# stores and the SDK run stores for prompts (human turns), sessions and activity, no tokens.
agents = ["claude_code", "codex", "cursor_api", "cursor_cli", "pi"]

# Emit ONLY human prompts from the local `cursor` collector, dropping its token rows. This is the
# one safe way to run `cursor` and `cursor_api` together: cursor_api's feed is token usage and
# carries no prompt records at all, so human turns are the one thing it can never give you, and a
# human turn holds zero tokens - so nothing can double-count. The dropped token rows are the
# inferior copy regardless (no cache attribution, IDE only, no cursor-agent CLI).
# Also worth knowing: cursor_api_lookback_days bounds the FIRST scan only, so the API cannot reach
# back further than that. The local DB is the only source for Cursor IDE history older than
# that, and the only source of Cursor IDE human turns at any date.
# cursor_human_only = true

# Key for the activity rows' repo_key (an HMAC of the repository identity). Unset, a random salt is
# created as repo_key.salt next to the state file on first use. Set the same value on every machine
# so their keys match. Treat it as a secret.
# repo_key_salt = "env:AUT_REPO_KEY_SALT"

# activitywatch: OPT-IN (add "activitywatch" to agents above). Reads not-AFK window time from the
# local ActivityWatch server and sends it to agents.time_interval with the window title, which is
# private: redacted on this machine and never in a public view. Needs pg_dsn.
# activitywatch_url = "http://localhost:5600"
# Use https:// for another host. Plain http there still works, with a warning, for a private link:
# titles and purge deletes then travel unencrypted.
# Titles are kept for good by default (0). A number of days turns a limit on: older titles are not
# sent, and ActivityWatch's own window events older than that are deleted.
# activitywatch_title_days = 180
# activitywatch_titles = false        # this machine sends intervals and categories, but no titles
# Dropped entirely before sending (password managers and private browsing are built in, but a
# Chromium private window has no marker, so deny that browser here if it matters). Put the
# names of banks or other private apps HERE, never in code:
# activitywatch_deny_apps = ["Some Private App"]
# activitywatch_deny_titles = ["(?i)examplebank"]          # regexes, matched case-insensitively
# activitywatch_work_titles = ["example-intranet"]         # browser titles that count as work
# activitywatch_categories = { "My Tool" = "docs" }        # editor terminal agent dev browser comms docs design media other

# `aut outcomes`: the directories holding your git clones (searched 6 levels deep, node_modules and
# virtualenvs skipped), and whether to `git fetch` them and ask `gh` about merged PRs first (turn it
# on where the nightly job runs: without it squash-merged GitHub PRs count as abandoned).
# outcome_repo_roots = ["~/projects"]
# outcome_fetch = true

# The home directory the collectors read from. Defaults to the RUNNING user's $HOME, so on a
# SHARED machine it only ever sees YOUR logs, never other users' homes. Set it explicitly to
# be safe on a shared box:
#   Linux:    home = "/home/youruser"
#   macOS:    home = "/Users/youruser"
#   Windows:  home = "C:/Users/youruser"
# home = "/home/youruser"

# Cursor's state.vscdb is auto-located per OS (macOS ~/Library/Application Support/Cursor/...,
# Windows %APPDATA%/Cursor/..., Linux ~/.config/Cursor/...). Override only if yours is elsewhere:
# cursor_db_path = "/custom/path/Cursor/User/globalStorage/state.vscdb"

# cursor_sdk: usage from agents built on the Cursor Agent SDK, which don't write CLI/IDE logs -
# the SDK hands usage back in-process and the app persists it. Point this at a glob of the run
# manifest.json files those apps write (one per run).
# Unset -> the cursor_sdk collector does nothing. Use a "**" recursive glob:
# cursor_sdk_manifests = "/home/youruser/projects/**/.state/runs/*/manifest.json"

# cursor_api: OPT-IN, makes authenticated NETWORK calls to Cursor's dashboard API using the local
# Cursor session token (read at run time, never stored). This is the ACCURATE Cursor source - it
# captures cursor-agent CLI + composer usage the local state.vscdb collector cannot see (which is
# a lower bound). On a team plan it scopes strictly to YOUR OWN userId and re-checks every event,
# so a teammate's usage is never captured. Off by default. Requires Cursor installed + signed in.
# cursor_api = true
# cursor_api_lookback_days = 90    # first-scan window before a watermark exists

# `aut label` (optional extra `aut[label]`, Apple silicon): a local model labels steers, work time
# and window titles on this machine; only the label (an enum and a probability) is sent, except
# daily_note, which sends a short note the model writes from a day's counts. The
# nightly run (AUT_LABEL=1 in scan.env) labels only the tasks listed here; `aut label run --task T`
# runs any one by hand. Tasks: steer_intent work_category soft_outcome aw_title_relevance daily_note
# label_tasks = ["steer_intent"]
# label_model = "mlx-community/gemma-4-31b-it-4bit"   # a short name from README "The models", or a local Hugging Face snapshot; never downloaded by aut
# label_llama_server = "llama-server"   # the binary for aurelis-2b and kev-4b; a full path if the nightly job's PATH lacks it
# label_precision = 0.90       # per-label floors on your gold labels: tau is set to reach both,
# label_recall = 0.60          # out of fold; a model that misses one is marked as failing
# label_coverage = 0.75        # a module below this share of known labels is not exported
# label_budget_s = 3600        # time budget of one run; the rest waits for the next night
# label_mature_outcomes = false # opt-in local catch-up for older no-code episodes after evaluation

# `aut backup` (optional): an encrypted, deduplicated restic snapshot of the logs, the config, the
# label files and repo_key.salt. Steps and restore: docs/new-laptop.md. restic runs
# password_command itself, so aut never holds the password: keep it in the keychain (or a 0600
# file outside any repo, e.g. "cat ~/.config/restic/aut.password"). Write the repository string
# itself: an sftp: path holds no secret. env:VAR does not work under launchd, which starts the
# backup job with only the PATH its plist sets, so the variable is never there and every nightly
# run fails. Each good run also runs the retention: restic forget --tag aut --host <machine>
# --keep-daily 14 --keep-weekly 8 --keep-monthly 12, with --prune at most once a week.
# [backup]
# repository = "sftp:backup-host:/srv/restic/aut"       # an ~/.ssh/config Host alias works here
# password_command = "security find-generic-password -s aut-backup -w"
# retention = false                 # keep every snapshot; no forget or prune
# paths = ["~/.claude/projects"]     # REPLACES the default list (docs/new-laptop.md has it)
# excludes = ["*.tmp"]               # ADDED to the default exclude (~/.local/share/aut/label/models)

# `aut git-days`: your commits per Amsterdam day, from every clone here and on your other machines,
# to agents.git_commit_day for the public ledger. Counts only: no repo name, SHA, email or message
# leaves this machine. With enabled = true, `aut scan` runs it once the last good run is 20 h old.
# Your identities, hosts and paths belong HERE only, never in the repo. remotes are read with
# ssh -o BatchMode=yes (a key, no prompt) running the same hardened, read-only git; a host that
# fails makes that run write nothing, and so does a missing root. A stored day never goes down by
# itself (`aut git-days --allow-lower` rewrites it).
# [git_days]
# enabled = true
# since = 2022-02-03                            # the first day written (a TOML date or a string)
# identities = ["you@example.com"]              # your author emails (compared lowercased)
# shared_authors = [{ email_regex = "^shared@", repo_regex = "^some_repo_pattern$" }]
# roots = ["~/projects"]                        # searched 6 levels deep, vendored folders skipped
# exclude_dirs = []                             # exact physical paths outside your source scope
# remotes = [{ host = "my-vm", roots = ["~/projects"] }]     # an ~/.ssh/config Host alias

# Keep [transport] LAST: every key below a table header belongs to that table, so a top-level
# key written after this line would be read as transport.<key> and ignored.
[transport]
# Default transport: POST batches to the n8n ingest webhook (behind Cloudflare Access).
webhook_url    = "https://n8n.example.tld/webhook/llm-usage"
webhook_secret = "env:AUT_WEBHOOK_SECRET"      # shared secret sent as the X-AUT-Secret header

# Cloudflare Access service token (Zero Trust -> Access -> Service Auth). Set BOTH halves to push
# through Cloudflare Access from ANYWHERE - no VPN needed (this is CF's "Pattern 2" for CLI/cron).
# Sent as CF-Access-Client-Id / CF-Access-Client-Secret headers. Omit on-LAN/Tailscale if you point
# webhook_url straight at the internal n8n. aut sends the secret over https only (plain http only
# to localhost), so an internal URL needs TLS too (e.g. https://n8n.internal.example/webhook/llm-usage).
# cf_access_client_id     = "env:CF_ACCESS_CLIENT_ID"
# cf_access_client_secret = "env:CF_ACCESS_CLIENT_SECRET"

# pg_dsn: direct Postgres. The webhook carries usage rows only, so pg_dsn is also how session,
# activity, time, outcome, label and heartbeat rows arrive. `aut outcomes`, `aut outcome`,
# `aut episodes review`, `aut inspect`, `aut time add` and `aut label` need it too. With both
# set, usage goes over the webhook and falls back to pg_dsn when the webhook is unreachable.
# For a remote host add sslmode=require; without it aut warns, because libpq can fall back to
# plaintext. On a private link such as Tailscale, sslmode=disable says that is intended.
# Requires the [postgres] (or [label]) extra:
#   uv tool install "agent-usage-tracker[postgres] @ git+https://github.com/rhnfzl/agent-usage-tracker"
# pg_dsn = "env:AUT_PG_DSN"                     # e.g. postgresql://agents_writer@db.example:5432/agents?sslmode=require
