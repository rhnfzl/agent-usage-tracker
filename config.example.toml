# Copy to ~/.config/agent-usage-tracker/config.toml and edit.
# SECRETS NEVER LIVE IN THIS REPO. Put real values in the local config file or the
# environment; any "env:VAR" value is resolved at run time. That local file lives OUTSIDE
# the repo, so gitignore does not protect it - restrict it with filesystem permissions:
#   chmod 600 ~/.config/agent-usage-tracker/config.toml   (macOS / Linux)

# Role-based label for this machine (avoid personal names). e.g. laptop, buildbox, workstation.
machine = "laptop"

# Which agents to collect. Omit to collect all installed ones.
# cursor_sdk is included but no-ops until you set cursor_sdk_manifests below.
agents = ["claude_code", "codex", "cursor", "cursor_sdk", "pi"]

[transport]
# Default transport: POST batches to the n8n ingest webhook (behind Cloudflare Access).
webhook_url    = "https://n8n.example.tld/webhook/llm-usage"
webhook_secret = "env:AUT_WEBHOOK_SECRET"      # shared secret sent as the X-AUT-Secret header

# Optional fallback: direct Postgres over Tailscale. Only used if the webhook is
# unreachable. Requires the [postgres] extra (uv tool install "agent-usage-tracker[postgres]").
# pg_dsn = "env:AUT_PG_DSN"                     # e.g. postgresql://agents_writer@db.example:5432/agents

# The home directory the collectors read from. Defaults to the RUNNING user's $HOME, so on a
# SHARED machine it only ever sees YOUR logs, never other users' homes. Set it explicitly to
# be safe on a shared box:
#   Linux:    home = "/home/youruser"
#   macOS:    home = "/Users/youruser"
#   Windows:  home = "C:/Users/youruser"
# home = "/home/youruser"

# Cursor's state.vscdb is auto-located per OS (macOS ~/Library/Application Support/Cursor/...,
# Windows %APPDATA%/Cursor/..., Linux ~/.config/Cursor/...). Override only if yours is elsewhere:
# cursor_db_path = "/custom/path/Cursor/User/globalStorage/state.vscdb"

# cursor_sdk: usage from agents built on the Cursor Agent SDK, which don't write CLI/IDE logs -
# the SDK hands usage back in-process and the app persists it. Point this at a glob of the run
# manifest.json files those apps write (e.g. the tickets-orchestrator's per-ticket manifests).
# Unset -> the cursor_sdk collector does nothing. Use a "**" recursive glob:
# cursor_sdk_manifests = "/home/youruser/projects/**/.state/runs/*/manifest.json"
